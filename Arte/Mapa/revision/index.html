<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prólogo – propuestas de mapa</title>
<style>
  :root { --fondo:#f4efe6; --texto:#1f2a37; --tarjeta:#fff; --borde:#d8cfc0; --dorado:#b8862b; --azul:#1f3a5f; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--fondo); color:var(--texto); }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 48px; }
  h1 { color:var(--azul); margin:0 0 4px; }
  .sub { color:#5b6573; margin:0 0 24px; }
  .op { background:var(--tarjeta); border:1px solid var(--borde); border-radius:12px; padding:16px; margin-bottom:24px; }
  .op h2 { margin:0 0 4px; color:var(--azul); }
  .op h2 span { font-size:13px; background:var(--dorado); color:#fff; border-radius:999px; padding:2px 10px; margin-left:8px; vertical-align:middle; }
  svg { width:100%; height:auto; display:block; border-radius:8px; margin:12px 0; }
  ul { margin:4px 0 0 18px; padding:0; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:700px){ .cols{ grid-template-columns:1fr; } }
  .ley { display:flex; flex-wrap:wrap; gap:14px; font-size:14px; margin-bottom:20px; }
  .ley i { display:inline-block; width:14px; height:14px; border-radius:3px; margin-right:6px; vertical-align:-2px; }
</style>
</head>
<body>
<main>
  <h1>Prólogo: calle de Atenas – propuestas de mapa</h1>
  <p class="sub">A escala real: cada cuadro = 1 unidad. Alexios mide 2,2 y salta como máximo ≈ 3,3. El rectángulo punteado es lo que se ve en pantalla.</p>
  <div class="ley">
    <span><i style="background:#9e8c78"></i>Piedra (sólido)</span>
    <span><i style="background:#e9d9b8"></i>Casa / tejado (sólido)</span>
    <span><i style="background:#d9d2c5"></i>Columna (sólido)</span>
    <span><i style="background:#f5e6b8;border:1px solid #b8862b"></i>Pergamino</span>
    <span><i style="background:#8a8f99"></i>Santuario</span>
    <span><i style="background:#1f3a5f"></i>Alexios (inicio)</span>
  </div>
  <div id="ops"></div>
</main>
<script>
// x, y = esquina inferior izquierda en unidades del juego; t = tipo
const OPCIONES = [
  { id:'A', nombre:'Calle hacia la colina', rec:true, ancho:[-9,33], vista:[-9,9],
    texto:'Nivel más ancho que la pantalla: la cámara sigue a Alexios. Se recorre la calle, se sube a los tejados y se asciende por la colina hasta el santuario, como en el guion ("el templo de la colina").',
    pros:['Se siente como un nivel de verdad (exploración)','Encaja con el guion','Usa todo lo aprendido: colliders, triggers y una cámara que sigue'],
    contras:['Necesita un script pequeño de cámara (3 líneas)','Un poco más largo de probar'],
    piezas:[
      ['piedra',-9,-5,19,1],['piedra',10,-5,8,2.5],['piedra',18,-5,6,4],['piedra',24,-5,9,5.5],
      ['casa',1,-4,4,2.5],['columna',7,-4,0.8,1.2],['columna',12.5,-2.5,0.6,2.3],['columna',15.5,-2.5,0.6,2.3],['piedra',12.2,-0.2,4.2,0.4],
      ['piedra',-9.4,-5,0.4,12],['piedra',33,-5,0.4,12],
      ['perg',2.8,-1.3,0.4,0.55],['perg',14.2,0.4,0.4,0.55],['perg',21,1.4,0.4,0.55],
      ['sant',28.5,0.5,1.8,2.8],['heroe',-7,-4,0.8,2.2]]},
  { id:'B', nombre:'Terrazas de la Acrópolis', ancho:[-9,9], vista:[-9,9],
    texto:'Una sola pantalla en zigzag: tres terrazas de piedra unidas por escalones. El santuario está arriba a la derecha y hay que subir pasando por todas.',
    pros:['Cabe en una pantalla: no hace falta cámara','Recorrido claro de abajo arriba'],
    contras:['Más apretado: saltos más exigentes','Menos sensación de explorar'],
    piezas:[
      ['piedra',-9,-5,18,1],['piedra',1.5,-4,1.5,1.3],['piedra',3,-4,6,2.5],['piedra',-1.2,-0.9,2.6,0.4],['piedra',-9,-1.5,6.5,2.5],
      ['piedra',-2,2.2,2.5,0.4],['piedra',2,1,7,0.6],
      ['columna',-6,1,0.6,1.8],['columna',8.2,1.6,0.6,2.4],
      ['piedra',-9.4,-5,0.4,10],['piedra',9,-5,0.4,10],
      ['perg',-6.5,-3.4,0.4,0.55],['perg',-8.3,1.4,0.4,0.55],['perg',-0.95,2.8,0.4,0.55],
      ['sant',5.5,1.6,1.6,2.5],['heroe',-1,-4,0.8,2.2]]},
  { id:'C', nombre:'Tejados de Atenas', ancho:[-9,9], vista:[-9,9],
    texto:'Una pantalla con casas de distintas alturas. Los pergaminos están en los tejados; el santuario, al final de la calle. Es el mapa actual, pero con forma de ciudad.',
    pros:['Lo más sencillo de construir y explicar','Parecido a la guía de clase'],
    contras:['Recorrido corto','El santuario se ve desde el principio'],
    piezas:[
      ['piedra',-9,-5,18,1],['casa',-6.5,-4,3,2],['casa',-1.5,-4,3,4],['casa',3.5,-4,2.5,2.5],['columna',-3.2,-4,0.6,1],
      ['piedra',-3.2,-0.6,1.5,0.4],
      ['piedra',-9.4,-5,0.4,10],['piedra',9,-5,0.4,10],
      ['perg',-5.2,-1.6,0.4,0.55],['perg',-0.2,0.4,0.4,0.55],['perg',4.55,-1.1,0.4,0.55],
      ['sant',7,-4,1.6,2.5],['heroe',-8,-4,0.8,2.2]]},
];
const COLOR = { piedra:'#9e8c78', casa:'#e9d9b8', columna:'#d9d2c5', perg:'#f5e6b8', sant:'#8a8f99', heroe:'#1f3a5f' };
const ESC = 40; // píxeles por unidad
function svg(o) {
  const [x0,x1] = o.ancho, y0 = -5.5, y1 = 6.5, W = (x1-x0+1)*ESC, H = (y1-y0)*ESC;
  const X = x => (x - x0 + 0.5)*ESC, Y = y => (y1 - y)*ESC;
  let s = `<svg style="max-width:${W}px" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa ${o.nombre}"><rect width="${W}" height="${H}" fill="#fbd7a6"/>`;
  for (let gx = Math.ceil(x0); gx <= x1; gx++) s += `<line x1="${X(gx)}" x2="${X(gx)}" y1="0" y2="${H}" stroke="#000" stroke-opacity=".06"/>`;
  for (let gy = Math.ceil(y0); gy <= y1; gy++) s += `<line y1="${Y(gy)}" y2="${Y(gy)}" x1="0" x2="${W}" stroke="#000" stroke-opacity=".06"/>`;
  for (const [t,x,y,w,h] of o.piezas) {
    if (h <= 0) continue;
    const borde = t==='perg' ? ' stroke="#b8862b" stroke-width="2"' : t==='casa' ? ' stroke="#b9a37c"' : '';
    s += `<rect x="${X(x)}" y="${Y(y+h)}" width="${w*ESC}" height="${h*ESC}" rx="${t==='heroe'?6:2}" fill="${COLOR[t]}"${borde}/>`;
    if (t==='sant') s += `<text x="${X(x+w/2)}" y="${Y(y+h)-6}" text-anchor="middle" font-size="12" fill="#1f2a37">Santuario</text>`;
    if (t==='heroe') s += `<text x="${X(x+w/2)}" y="${Y(y+h)-6}" text-anchor="middle" font-size="12" fill="#1f2a37">Alexios</text>`;
  }
  const [v0,v1] = o.vista;
  s += `<rect x="${X(v0)}" y="${Y(5)}" width="${(v1-v0)*ESC}" height="${10*ESC}" fill="none" stroke="#1f3a5f" stroke-width="2" stroke-dasharray="6 5"/>`;
  return s + '</svg>';
}
document.getElementById('ops').innerHTML = OPCIONES.map(o => `
  <section class="op">
    <h2>Opción ${o.id}: ${o.nombre}${o.rec ? '<span>Recomendada</span>' : ''}</h2>
    <p>${o.texto}</p>
    ${svg(o)}
    <div class="cols">
      <div><b>A favor</b><ul>${o.pros.map(p=>`<li>${p}</li>`).join('')}</ul></div>
      <div><b>En contra</b><ul>${o.contras.map(p=>`<li>${p}</li>`).join('')}</ul></div>
    </div>
  </section>`).join('');
</script>
</body>
</html>
